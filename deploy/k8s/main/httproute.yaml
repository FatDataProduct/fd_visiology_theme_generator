apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fd-visiology-theme-generator-main
  namespace: front
spec:
  hostnames:
  - themebuilder.fatdataseo.com
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: front-public
    namespace: istio-ingress
    sectionName: https
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: fd-visiology-theme-generator-main-service
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
    timeouts:
      request: 30s
